
spring.application.name=baozi-store

# Conexao com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/baozi_store
spring.datasource.username=baozi_app
spring.datasource.password=${BAOZI_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
